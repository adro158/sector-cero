<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="arco" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
  </defs>

  <!-- ==================== FOTOGRAMA 1: IDLE / NEUTRO (X: 0) ==================== -->
  <g transform="translate(0, 0)">
    <ellipse cx="80" cy="186" rx="42" ry="10" fill="#000000" opacity="0.35"/>
    <!-- Pies -->
    <rect x="52" y="162" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <rect x="86" y="162" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <!-- Brazo trasero -->
    <circle cx="124" cy="126" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <!-- Torso -->
    <rect x="54" y="104" width="52" height="60" rx="14" fill="url(#metal)" stroke="#000" stroke-width="5"/>
    <rect x="54" y="142" width="52" height="12" fill="#111827"/>
    <rect x="73" y="139" width="14" height="18" rx="3" fill="#ff0055" stroke="#000" stroke-width="3"/>
    <!-- Cabeza y Visor -->
    <rect x="30" y="24" width="100" height="84" rx="36" fill="#1e293b" stroke="#000" stroke-width="6"/>
    <rect x="42" y="38" width="76" height="52" rx="18" fill="#050b14" stroke="#000" stroke-width="4"/>
    <polygon points="52,64 68,64 62,72" fill="#00f6ff"/>
    <polygon points="92,64 108,64 98,72" fill="#00f6ff"/>
    <!-- Brazo frontal y Arco -->
    <circle cx="36" cy="132" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <path d="M 28 60 Q 8 130 28 190" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    <path d="M 28 60 Q 8 130 28 190" fill="none" stroke="url(#arco)" stroke-width="5" stroke-linecap="round"/>
    <line x1="124" y1="126" x2="14" y2="126" stroke="#00f6ff" stroke-width="4"/>
  </g>

  <!-- ==================== FOTOGRAMA 2: PASO IZQUIERDO (X: 160) ==================== -->
  <g transform="translate(160, -6)">
    <ellipse cx="80" cy="192" rx="40" ry="9" fill="#000000" opacity="0.3"/>
    <!-- Pies desfasados -->
    <rect x="46" y="156" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <rect x="92" y="166" width="20" height="20" rx="9" fill="#111827" stroke="#000" stroke-width="4"/>
    <!-- Brazo trasero -->
    <circle cx="126" cy="120" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <!-- Torso (ligeramente inclinado) -->
    <rect x="54" y="104" width="52" height="60" rx="14" fill="url(#metal)" stroke="#000" stroke-width="5"/>
    <rect x="54" y="142" width="52" height="12" fill="#111827"/>
    <rect x="73" y="139" width="14" height="18" rx="3" fill="#ff0055" stroke="#000" stroke-width="3"/>
    <!-- Cabeza -->
    <rect x="30" y="24" width="100" height="84" rx="36" fill="#1e293b" stroke="#000" stroke-width="6"/>
    <rect x="42" y="38" width="76" height="52" rx="18" fill="#050b14" stroke="#000" stroke-width="4"/>
    <polygon points="52,64 68,64 62,72" fill="#00f6ff"/>
    <polygon points="92,64 108,64 98,72" fill="#00f6ff"/>
    <!-- Brazo frontal y Arco elevado -->
    <circle cx="34" cy="126" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <path d="M 28 54 Q 6 124 28 184" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    <path d="M 28 54 Q 6 124 28 184" fill="none" stroke="url(#arco)" stroke-width="5" stroke-linecap="round"/>
    <line x1="126" y1="120" x2="14" y2="120" stroke="#00f6ff" stroke-width="4"/>
  </g>

  <!-- ==================== FOTOGRAMA 3: CONTACTO (X: 320) ==================== -->
  <g transform="translate(320, 0)">
    <ellipse cx="80" cy="186" rx="42" ry="10" fill="#000000" opacity="0.35"/>
    <!-- Pies apoyados -->
    <rect x="54" y="162" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <rect x="84" y="162" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <!-- Brazo trasero -->
    <circle cx="124" cy="126" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <!-- Torso -->
    <rect x="54" y="104" width="52" height="60" rx="14" fill="url(#metal)" stroke="#000" stroke-width="5"/>
    <rect x="54" y="142" width="52" height="12" fill="#111827"/>
    <rect x="73" y="139" width="14" height="18" rx="3" fill="#ff0055" stroke="#000" stroke-width="3"/>
    <!-- Cabeza -->
    <rect x="30" y="24" width="100" height="84" rx="36" fill="#1e293b" stroke="#000" stroke-width="6"/>
    <rect x="42" y="38" width="76" height="52" rx="18" fill="#050b14" stroke="#000" stroke-width="4"/>
    <polygon points="52,64 68,64 62,72" fill="#00f6ff"/>
    <polygon points="92,64 108,64 98,72" fill="#00f6ff"/>
    <!-- Brazo frontal y Arco -->
    <circle cx="36" cy="132" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <path d="M 28 60 Q 8 130 28 190" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    <path d="M 28 60 Q 8 130 28 190" fill="none" stroke="url(#arco)" stroke-width="5" stroke-linecap="round"/>
    <line x1="124" y1="126" x2="14" y2="126" stroke="#00f6ff" stroke-width="4"/>
  </g>

  <!-- ==================== FOTOGRAMA 4: PASO DERECHO (X: 480) ==================== -->
  <g transform="translate(480, -6)">
    <ellipse cx="80" cy="192" rx="40" ry="9" fill="#000000" opacity="0.3"/>
    <!-- Pies cambiados -->
    <rect x="48" y="166" width="20" height="20" rx="9" fill="#111827" stroke="#000" stroke-width="4"/>
    <rect x="94" y="156" width="22" height="24" rx="10" fill="#1a202c" stroke="#000" stroke-width="4"/>
    <!-- Brazo trasero -->
    <circle cx="122" cy="130" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <!-- Torso -->
    <rect x="54" y="104" width="52" height="60" rx="14" fill="url(#metal)" stroke="#000" stroke-width="5"/>
    <rect x="54" y="142" width="52" height="12" fill="#111827"/>
    <rect x="73" y="139" width="14" height="18" rx="3" fill="#ff0055" stroke="#000" stroke-width="3"/>
    <!-- Cabeza -->
    <rect x="30" y="24" width="100" height="84" rx="36" fill="#1e293b" stroke="#000" stroke-width="6"/>
    <rect x="42" y="38" width="76" height="52" rx="18" fill="#050b14" stroke="#000" stroke-width="4"/>
    <polygon points="52,64 68,64 62,72" fill="#00f6ff"/>
    <polygon points="92,64 108,64 98,72" fill="#00f6ff"/>
    <!-- Brazo frontal y Arco -->
    <circle cx="38" cy="136" r="10" fill="#00f6ff" stroke="#000" stroke-width="3"/>
    <path d="M 28 66 Q 10 136 28 196" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    <path d="M 28 66 Q 10 136 28 196" fill="none" stroke="url(#arco)" stroke-width="5" stroke-linecap="round"/>
    <line x1="122" y1="130" x2="14" y2="130" stroke="#00f6ff" stroke-width="4"/>
  </g>
</svg>
